name: Game tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  game-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GODOT_VERSION: "4.6"
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        shell: bash
        run: |
          archive="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/${archive}.zip" \
            --output "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/$archive" "$RUNNER_TEMP/godot"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Import resources
        run: godot --headless --path . --import
      - name: Run core game tests
        run: timeout 180s godot --headless --path . --script res://tests/run_all.gd
      - name: Validate environment art packs when present
        if: ${{ hashFiles('tools/check_environment_art_pack.py') != '' }}
        run: python tools/check_environment_art_pack.py --all
